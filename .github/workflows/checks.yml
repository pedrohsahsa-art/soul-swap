name: Tests and tester package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node tests/controller.test.cjs
      - run: python tests/build_test.py
      - run: python tests/package_test.py
      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          Get-ChildItem scripts,tests -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: tester-package
          path: dist/*
